name: FastAPI CI Pipeline

on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches:
      - 'main'
      - 'dev'

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy bandit pip-audit types-requests

      - name: Lint & Format (Ruff)
        run: |
          ruff check . 
          ruff format --check .

      - name: Type Checking (Mypy)
        run: mypy . --install-types --non-interactive
      
      - name: Security Scan (Bandit & Audit)
        run: |
          bandit -r app/ -c pyproject.toml
          # urllib3 CVEs: blocked by pysus -> elasticsearch<8 -> urllib3<2 constraint
          # tqdm CVE-2024-34062: blocked by pysus 1.0.0 hard pin tqdm==4.64.0
          pip-audit -r requirements.txt \
            --ignore-vuln CVE-2024-34062 \
            --ignore-vuln CVE-2025-50181 \
            --ignore-vuln CVE-2025-66418 \
            --ignore-vuln CVE-2025-66471 \
            --ignore-vuln CVE-2026-21441
